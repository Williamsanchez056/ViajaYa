name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restaurar dependencias
        run: dotnet restore ViajaYa.slnx

      - name: Compilar solucion
        run: dotnet build ViajaYa.slnx --no-restore

      - name: Ejecutar pruebas
        run: dotnet test ViajaYa.slnx --no-build --verbosity normal
